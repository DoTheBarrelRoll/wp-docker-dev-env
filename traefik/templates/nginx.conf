# Generated per site by create-site.sh.
# Traefik terminates TLS, so this server only ever sees plain HTTP. WordPress
# learns the real scheme from the X-Forwarded-Proto header, which the official
# wordpress image already handles in wp-config.php.
server {
    listen 80;
    server_name ${DOMAIN};
    root /var/www/html;
    index index.php index.html;

    # Large enough for media uploads and plugin or theme ZIP installs.
    # Keep in sync with upload_max_filesize in php/php-fpm-dev.ini.
    client_max_body_size 128m;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # Credentials, dependency manifests and boilerplate are never served.
    location ~* ^/(auth\.json|composer\.(json|lock)|package(-lock)?\.json|pnpm-lock\.yaml|yarn\.lock|wp-config[^/]*\.php|readme\.html|license\.txt)$ {
        deny all;
    }

    # Debug logs, database dumps and editor leftovers.
    location ~* \.(log|sql|bak|old|swp|dist)$ {
        deny all;
    }

    # Dotfiles, including .git and .env.
    location ~ /\. {
        deny all;
    }

    location ^~ /vendor/ {
        deny all;
    }

    # Uploads are served straight from disk. PHP is never executed here, and a
    # missing file can fall back to the production site.
    location ^~ /wp-content/uploads/ {
        location ~ \.php$ {
            deny all;
        }
        expires 7d;
        access_log off;
        try_files $uri @uploads_fallback;
    }

    location @uploads_fallback {
        ${UPLOADS_FALLBACK}
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~* \.(css|js|mjs|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|eot|mp4|webm)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;

        # A request for a script that does not exist must not reach PHP-FPM.
        if (!-f $document_root$fastcgi_script_name) {
            return 404;
        }

        fastcgi_pass wordpress:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Long enough for imports, migrations and WP Migrate DB Pro pulls.
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;

        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;
    }
}
