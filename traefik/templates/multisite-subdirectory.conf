# Included by nginx.conf when the site is a subdirectory network.
#
# A subsite lives under a path of its own, /sub/, and asks for core paths below
# it: /sub/wp-admin/, /sub/wp-includes/js/..., /sub/wp-login.php. Those files
# only exist at the document root, so the leading path segment is stripped
# whenever nothing matches it on disk. WordPress reads the site from
# REQUEST_URI, which keeps the original path, so the right subsite still loads.
#
# The rewrites run before nginx picks a location, so that the stripped URI is
# matched against the PHP handler. That is what "rewrite ... last" in a
# server-level "if" does, and it is one of the two directives documented as
# safe inside "if". "try_files" cannot replace it here: it would match an
# existing .php file and serve its source as a static file.
#
# Relative redirects keep the browser on https, which only Traefik sees. This
# server is always reached over plain http.
absolute_redirect off;

if (!-e $request_filename) {
    rewrite /wp-admin$ $uri/ permanent;
    rewrite ^(/[^/]+)?(/wp-.*) $2 last;
    rewrite ^(/[^/]+)?(/.*\.php) $2 last;
}
