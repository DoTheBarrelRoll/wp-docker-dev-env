; Development overrides for the WP-CLI containers.
memory_limit = 1024M

; Long imports, exports and search-replace runs must not be interrupted.
max_execution_time = 0
max_input_time = -1

; One local site calling another over HTTPS has to verify a certificate signed
; by the mkcert development CA. The host trusts it, the image does not, so the
; traefik stack keeps a bundle of the public roots with that CA appended and
; every site mounts it. curl.cainfo covers the WordPress HTTP API, and
; openssl.cafile the stream wrappers it falls back to.
curl.cainfo = /usr/local/share/ca-certificates/dev-ca-bundle.crt
openssl.cafile = /usr/local/share/ca-certificates/dev-ca-bundle.crt
