# Generated per site by create-site.sh.
#
# Image tags are pinned so that the PHP version cannot change under a project
# when images are pulled again. WordPress core itself lives in ./src and is
# therefore pinned per project by the bind mount, not by the image tag.

# Per-site environment variables, for the values a theme or plugin reads with
# getenv(): API keys, tokens, feature switches. create-site.sh writes the file
# with a comment header and leaves the values to you. It sits outside ./src, so
# nginx never serves it, and environment: below wins over it, so nothing in it
# can take the database or the site URL out from under the stack. Compose reads
# the same file for ${...} interpolation here, so keep COMPOSE_* keys out of it.
x-wp-secrets: &wp-secrets
  - path: ./.env
    required: false

# Docker Engine on Linux does not resolve host.docker.internal by itself, and
# the egress proxy listens on the host. Only the containers that make outbound
# requests of their own need the name.
x-wp-host: &wp-host
  - "host.docker.internal:host-gateway"

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: mysql
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  # Everything the containers send out goes through the egress proxy in the
  # traefik stack, which runs in the host's network namespace. A VPN client
  # takes the default route for itself and leaves a bridge network with no way
  # out; without this, WP Migrate cannot activate its license, WP-CLI cannot
  # install a plugin and Composer cannot reach packagist. Both spellings are
  # set, because curl reads the lower case names and most other tools the upper
  # case ones. Put DEV_PROXY_URL= in ./.env to send traffic straight out
  # instead, on a machine that does not run the proxy.
  http_proxy: &proxy-url "${DEV_PROXY_URL-http://host.docker.internal:3128}"
  https_proxy: *proxy-url
  HTTP_PROXY: *proxy-url
  HTTPS_PROXY: *proxy-url
  no_proxy: &proxy-bypass "${DEV_PROXY_BYPASS-localhost,127.0.0.1,mysql,nginx,mailpit,${DOMAIN},*.${DOMAIN}}"
  NO_PROXY: *proxy-bypass
  # Applied in every context that loads wp-config.php, web and WP-CLI alike.
  # WP_HOME and WP_SITEURL, generated for a single site only, keep the site
  # local even when the database comes from production. A network reads every
  # site URL from its own tables, so they cannot be pinned there.
  WORDPRESS_CONFIG_EXTRA: |
    define( 'FS_METHOD', 'direct' );
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'SCRIPT_DEBUG', true );
    define( 'WP_ENVIRONMENT_TYPE', 'local' );
    define( 'AUTOMATIC_UPDATER_DISABLED', true );
    define( 'WP_HOME', 'https://${DOMAIN}' );
    define( 'WP_SITEURL', 'https://${DOMAIN}' );
    // The WordPress HTTP API, and with it WP Migrate, takes a proxy from these
    // constants. The environment alone would cover only the requests that go
    // out through curl, not the ones that fall back to sockets. Nothing is
    // defined when the proxy is switched off with an empty DEV_PROXY_URL.
    if ( getenv( 'http_proxy' ) ) {
        define( 'WP_PROXY_HOST', parse_url( getenv( 'http_proxy' ), PHP_URL_HOST ) );
        define( 'WP_PROXY_PORT', parse_url( getenv( 'http_proxy' ), PHP_URL_PORT ) ?: 80 );
        define( 'WP_PROXY_BYPASS_HOSTS', getenv( 'no_proxy' ) ?: '' );
    }

services:
  # MariaDB, because the WP-CLI image ships the MariaDB client. Against MySQL
  # 8.0 that client rejects the server's self-signed certificate and cannot
  # load caching_sha2_password, so every "wp db" command fails to connect.
  mysql:
    image: mariadb:11.8
    container_name: ${SITE_NAME}-db
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      # Lets the server upgrade its own data directory when the image tag is
      # bumped, instead of refusing to start on the existing volume.
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - wp-internal
    restart: "no"

  wordpress:
    image: wordpress:php8.4-fpm
    container_name: ${SITE_NAME}-app
    depends_on:
      mysql:
        condition: service_healthy
    env_file: *wp-secrets
    extra_hosts: *wp-host
    environment:
      <<: *wp-env
      # Only the web container debugs; WP-CLI output stays free of notices.
      WORDPRESS_DEBUG: 1
    volumes:
      - ./src:/var/www/html
      - ./php/php-fpm-dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
    networks:
      - wp-internal
    restart: "no"

  nginx:
    image: nginx:1.31-alpine
    container_name: ${SITE_NAME}-nginx
    depends_on:
      - wordpress
    volumes:
      - ./src:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/configs:/etc/nginx/custom_includes:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${SITE_NAME}.rule=${TRAEFIK_RULE}"
      - "traefik.http.routers.${SITE_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${SITE_NAME}.tls=true"
      - "traefik.http.services.${SITE_NAME}.loadbalancer.server.port=80"
      - "traefik.docker.network=web-proxy"
    networks:
      - wp-internal
      - web-proxy
    restart: "no"

  # Catches every mail the site sends, so a production database imported here
  # can never email real people. Inbox at https://mail.${DOMAIN}.
  mailpit:
    image: axllent/mailpit:v1.31
    container_name: ${SITE_NAME}-mail
    environment:
      MP_MAX_MESSAGES: 500
      TZ: Europe/Helsinki
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${SITE_NAME}-mail.rule=Host(`mail.${DOMAIN}`)"
      # Traefik derives a router's priority from the length of its rule, and on
      # a subdomain network the site rule is both longer and a match for
      # mail.${DOMAIN}. An explicit priority keeps the inbox reachable.
      - "traefik.http.routers.${SITE_NAME}-mail.priority=100"
      - "traefik.http.routers.${SITE_NAME}-mail.entrypoints=websecure"
      - "traefik.http.routers.${SITE_NAME}-mail.tls=true"
      - "traefik.http.services.${SITE_NAME}-mail.loadbalancer.server.port=8025"
      - "traefik.docker.network=web-proxy"
    networks:
      - wp-internal
      - web-proxy
    restart: "no"

  # Runs once on every "docker compose up" and is idempotent. It waits for the
  # wordpress container to lay down core files and wp-config.php instead of
  # writing its own, so the reverse proxy and config extras stay intact.
  wp-setup:
    image: wordpress:cli-php8.4
    container_name: ${SITE_NAME}-setup
    user: "33:33"
    depends_on:
      mysql:
        condition: service_healthy
      wordpress:
        condition: service_started
    env_file: *wp-secrets
    extra_hosts: *wp-host
    environment:
      <<: *wp-env
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - ./src:/var/www/html
      - ./php/php-cli-dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
    networks:
      - wp-internal
    restart: "no"
    command: >
      /bin/sh -c "
      echo 'Waiting for WordPress core files...';
      for i in $$(seq 1 60); do [ -f wp-load.php ] && [ -s wp-config.php ] && break; sleep 2; done;
      if [ ! -s wp-config.php ]; then echo 'The wordpress container never created wp-config.php.'; exit 1; fi;
      if wp core ${IS_INSTALLED} 2>/dev/null; then
        echo 'WordPress is already installed.';
      else
        echo 'Installing WordPress...';
        wp core ${CORE_INSTALL} --url=https://${DOMAIN} --title='${SITE_NAME} Local' --admin_user=admin --admin_password=password --admin_email=admin@${DOMAIN} --skip-email;
      fi;
      if wp plugin is-installed wp-migrate-db-pro; then wp ${PLUGIN_ACTIVATE} wp-migrate-db-pro; fi;
      "

  # Not started by "docker compose up". Use:
  #   docker compose run --rm wp-cli wp <command>
  wp-cli:
    image: wordpress:cli-php8.4
    profiles:
      - cli
    user: "33:33"
    depends_on:
      mysql:
        condition: service_healthy
    env_file: *wp-secrets
    extra_hosts: *wp-host
    environment:
      <<: *wp-env
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - ./src:/var/www/html
      - ./php/php-cli-dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
    networks:
      - wp-internal

networks:
  wp-internal:
  web-proxy:
    external: true

volumes:
  db_data:
    name: ${SITE_NAME}_db_data
