services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    environment:
      - TZ=Europe/Helsinki
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      # Plain HTTP always lands on the same site over HTTPS.
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      # Certificates for the local sites.
      - "--providers.file.filename=/etc/traefik/dynamic_conf.yaml"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "443:443"
      # Dashboard, loopback only: the API runs without authentication.
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/etc/traefik/certs:ro
      - ./dynamic_conf.yaml:/etc/traefik/dynamic_conf.yaml:ro
    networks:
      - web-proxy

  # Outbound HTTP and HTTPS for the site containers. It shares the host's
  # network namespace on purpose: a VPN client owns the default route, so the
  # host still reaches the internet while a Docker bridge network no longer
  # does. Configuration and the full reasoning are in squid.conf.
  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge
    container_name: egress-proxy
    restart: unless-stopped
    environment:
      - TZ=Europe/Helsinki
    network_mode: host
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro

networks:
  web-proxy:
    external: true
