services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    environment:
      - TZ=Europe/Helsinki
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      # Plain HTTP always lands on the same site over HTTPS.
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      # Certificates for the local sites.
      - "--providers.file.filename=/etc/traefik/dynamic_conf.yaml"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "443:443"
      # Dashboard, loopback only: the API runs without authentication.
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/etc/traefik/certs:ro
      - ./dynamic_conf.yaml:/etc/traefik/dynamic_conf.yaml:ro
    networks:
      - web-proxy

networks:
  web-proxy:
    external: true
